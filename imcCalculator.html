<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC Rosa</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff0f6; /* Rosa clarinho de fundo */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.3); /* Sombra rosa */
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #d6336c; /* Rosa mais forte para título */
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #db7093; /* Rosa médio */
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ffb6c1; /* Borda rosa claro */
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #ff69b4; /* Rosa vibrante */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #ff1493; /* Rosa mais escuro no hover */
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            border: 1px solid #ffb6c1; /* Borda rosa */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 Calculadora de IMC </h1>
        
        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1">
        </div>

        <div class="input-group">
            <label for="altura">Altura (metros):</label>
            <input type="number" id="altura" step="0.01">
        </div>

        <button onclick="calcularIMC()">Calcular</button>

        <div id="resultado"></div>
    </div>
